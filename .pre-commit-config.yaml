
---
repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        name: CMake Format
        entry: cmake-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.efp$'
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
        # A fragment potential is another program's output, kept verbatim so it can
        # be compared against that program. Reformatting one silently edits the
        # reference a validation number is measured against, which is the opposite
        # of what a reference is for -- and these hooks rewrite in place, so the
        # edit lands whether or not anyone looks.
        exclude: '\.efp$'
  - repo: local
    hooks:
      - id: mqc-lint
        name: mqc house rules
        # Comment markers and duplicated physical constants. Strict since the
        # predoc migration: the 302 `!>` blocks that `--allow-predoc` existed to
        # tolerate have been moved below their declarations, so the flag is no
        # longer passed. See tools/lint/README.md.
        entry: tools/lint/mqc_lint.py
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
      - id: mqc-no-naked-mpi-blas
        name: no naked MPI or BLAS
        # pic-mpi is the only layer that knows whether this build has
        # `mpi_f08` or the legacy `mpi` module, and some compilers ship only
        # one. A direct call compiles here and breaks someone else's build,
        # which is a class of failure no test catches.
        entry: tools/lint/no_naked_mpi_or_blas.sh
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
      - id: mqc-scf-call-sites
        name: SCF calls forward their settings
        # An SCF call that drops a setting makes it silently inert: read from
        # the deck, validated by the schema, carried through the config, and
        # then never used. Three separate instances of this shipped before the
        # check existed. Ratcheted against scf_call_sites_baseline.txt, which
        # is meant to shrink.
        entry: tools/lint/scf_call_sites.py
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
      - id: fprettify
        name: fprettify
        entry: fprettify --silent -i 3 -l 122
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
