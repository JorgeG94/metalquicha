
---
repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        name: CMake Format
        entry: cmake-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.efp$'
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
        # A fragment potential is another program's output, kept verbatim so it can
        # be compared against that program. Reformatting one silently edits the
        # reference a validation number is measured against, which is the opposite
        # of what a reference is for -- and these hooks rewrite in place, so the
        # edit lands whether or not anyone looks.
        exclude: '\.efp$'
  - repo: local
    hooks:
      - id: mqc-lint
        name: mqc house rules
        # Comment markers and duplicated physical constants. `--allow-predoc`
        # tolerates `!>` where it documents a declaration, because swapping
        # those to `!!` in place would reattach the docstring to whatever sits
        # above it; see tools/lint/README.md.
        entry: tools/lint/mqc_lint.py --allow-predoc
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
      - id: fprettify
        name: fprettify
        entry: fprettify --silent -i 3 -l 122
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
