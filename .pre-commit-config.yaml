
---
repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        name: CMake Format
        entry: cmake-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^tools/efp_validation/reference/.*\.efp$'
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
        # GAMESS's MAKEFP output is a reference and has to stay byte-identical to
        # what GAMESS wrote. It emits trailing spaces -- section headers such as
        # " MONOPOLES " carry one, and the banner several -- so tidying them away
        # quietly stops the reference being one, and would make any future
        # byte-level comparison of our renderer against it meaningless.
        exclude: '^tools/efp_validation/reference/.*\.efp$'
  - repo: local
    hooks:
      - id: fprettify
        name: fprettify
        entry: fprettify --silent -i 3 -l 122
        language: system
        types: [file]
        files: '\.(f|F|f90|F90)$'
