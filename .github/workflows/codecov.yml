name: Codecov

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Supersede a branch's own earlier run, but never a run on `main`.
#
# The asymmetry is the whole point. A cancelled PR run costs nothing: the push
# that cancelled it is about to measure the same branch again. A cancelled
# `main` run costs every PR opened afterwards, because codecov compares a pull
# request against the base commit's report and a commit whose run was killed
# has none -- the comparison then walks back to an older ancestor, or reports
# nothing at all. That failure surfaces on pull requests that were never
# cancelled themselves, which is what makes it hard to attribute.
#
# `head_ref` is set for pull_request events and empty otherwise, so the group
# is per-PR-branch there and per-branch for the push on `main`.
concurrency:
  group: codecov-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codecov:
    runs-on: ubuntu-latest
    # Sixty rather than thirty, because the CPU backend is now compiled into
    # the coverage build and measured. The run that first did so took 30.1
    # minutes -- 4.0 building and 23.9 in `make coverage` -- which passed by
    # nine seconds and is not a margin. The cost is the gcov instrumentation
    # rather than the work: `mqc_quao` is 12 s in a release build and 704 s
    # under coverage, and -O1 only brings it to 498 s, so this cannot be
    # optimised away. The alternative is dropping tests from the coverage run,
    # which is how half the program stopped being measured in the first place.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest

      - name: Install conda environment
        shell: bash -el {0}
        run: |
          conda env create --name mqc --file environment.yml
          conda install -c conda-forge -n mqc gfortran=14.2.0

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Configure CMake with coverage
        shell: bash -el {0}
        run: |
          conda activate mqc
          export FC=gfortran
          cmake -DCMAKE_BUILD_TYPE=Coverage-mqc \
                -DMQC_ENABLE_TBLITE=ON \
                -B build

      - name: Build
        shell: bash -el {0}
        run: |
          conda activate mqc
          # A runner has two cores, and `cmake --build` is serial by
          # default -- so without this it uses one of them.
          cmake --build build --parallel 2

      - name: Run coverage
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd build
          make coverage

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage_filtered.info
          flags: unittests
          name: codecov-metalquicha
          fail_ci_if_error: true
