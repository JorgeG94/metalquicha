name: Build MQC using local conda env (MPI, OpenMP, BLAS)

# `workflow_dispatch` so the long tests can be asked for on a branch before it
# merges. There is no `pull_request` trigger here, so there is no PR event to
# hang a pre-merge gate on; adding one would change when CI fires for every
# branch, which is a bigger decision than this change.
on: [push, workflow_dispatch]

# One build per branch. A push supersedes the one before it on the same branch,
# and the superseded run is cancelled rather than left to finish work nobody
# will read -- the matrix is eleven jobs, so a branch pushed three times in an
# hour was occupying the runners three times over.
#
# `github.ref` and not the workflow name: the group has to be per-branch or
# every branch cancels every other one, which is the way this goes wrong.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: CMake build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shipped default: `cmake -B build` with no flags at all, which is
          # what anyone who clones this gets. Every other job below passes all
          # four options explicitly, so without this one a changed default would
          # be invisible here -- the one configuration nobody tested would be the
          # one everybody builds.
          #
          # The matrix values below are what the defaults currently *are*, and
          # they only decide which validation steps run. If a default drifts away
          # from them this job fails rather than quietly skipping work.
          #
          # Note this job now builds Release, which is the default as of the
          # commit that changed it, and Release carries -march=native. That is
          # right here -- one runner builds and runs -- and wrong for anything
          # built somewhere other than where it runs, which is what
          # MQC_ARCH_FLAGS is for.
          - name: "default build (no flags)"
            defaults: true
            tblite: true
            legacy_mpi: false
            libcint: true
            libxc: true
            # libfint is the default backend now, so this job builds it. The
            # value is here only so the validation steps below gate correctly;
            # the build itself passes no flags at all.
            libfint: true
            # HDF5 is off by default, and this is where that is asserted: if
            # the default flips, this job stops matching what `cmake -B build`
            # produces and the mismatch shows up here rather than nowhere.
            hdf5: false
            # DL-FIND likewise, and for the same reason.
            dlfind: false
            crest: false
          # tblite built without libxc or the integrals backend -- a reduced
          # build, and only a build. The xTB validation is not run here: it
          # touches neither libxc nor the integrals, so on modern MPI it would
          # check exactly what the default build already checked. It runs there
          # and on the legacy-MPI job, which is the one thing this job's
          # configuration does not cover.
          - name: "with tblite (build only)"
            tblite: true
            legacy_mpi: false
            build_only: true
            # The one job that builds with Ninja, and it is not a formality.
            # CMake's Ninja generator runs every Fortran source through
            # `cpp -E` to scan module dependencies; the Makefile generator,
            # which every other job here uses, does not. So a construct that is
            # fine in a Fortran comment and not fine in C -- a literal
            # slash-star, which `cpp` reads as opening a block comment that
            # never closes -- breaks a Ninja build and nothing else. That is
            # exactly what happened: `ninja` ships in environment.yml, nothing
            # here used it, and the tree spent six days unbuildable that way
            # with CI green throughout. A build-only job is the right home,
            # since a generator fault is a build fault.
            generator: Ninja
          - name: "no tblite"
            tblite: false
            legacy_mpi: false
          # Legacy MPI, and nothing else on. This job exists to catch a compile
          # failure in the legacy path, so it isolates that one variable:
          # against "no tblite" above, which is everything off, the only
          # difference is `PIC_USE_LEGACY_MPI`. It used to build tblite too,
          # which added minutes without adding coverage of the thing being
          # tested.
          - name: "legacy MPI"
            tblite: false
            legacy_mpi: true
          # Integrals with libxc explicitly off -- a reduced build now that both
          # are on by default, and worth keeping: it is what you get asking only
          # for the integrals, and it is the configuration where the "this build
          # has no libxc" refusals are the behaviour under test. Takes libfint,
          # like everything else that does not say otherwise.
          - name: "integrals only (no libxc)"
            tblite: false
            legacy_mpi: false
            libcint: true
            libfint: true
          # The other integral backend, now that libfint is the default. This is
          # the only job that builds libcint, and it is not a formality: the two
          # are not interchangeable at compile time. libfint carries L (sp)
          # shells and libcint cannot represent one, so a libfint build defines
          # MQC_WITH_SP_SHELLS and compiles the fused-sp view in
          # mqc_czt_integrals.F90, while this job compiles the split-shell
          # path instead. Every other job exercises one of those two bodies of
          # code and this one exercises the other.
          #
          # libxc is on so the CPU validation step below runs: twelve of those
          # cases name a functional, and it is the validation, not the build,
          # that catches an integral going subtly wrong.
          - name: "with libcint (instead of libfint)"
            backend: libcint
            tblite: false
            legacy_mpi: false
            libcint: true
            libxc: true
          # HDF5, which until this job existed was built by nothing in CI: the
          # hand-written C bindings and the checkpoint backend are ~1200 lines
          # that no workflow had ever compiled, and the option defaults to off
          # so no other job reaches them. Nothing else is turned on -- the
          # checkpoint does not depend on a backend, and what is under test is
          # that the bindings still link against whatever HDF5 conda resolves
          # to. `addtest(mqc_hdf5_checkpoint)` is registered only under this
          # option, so the unit-test step below picks it up without a step of
          # its own.
          - name: "with hdf5"
            tblite: false
            legacy_mpi: false
            hdf5: true
          # `MQC_ENABLE_DLFIND` appeared in no job, and it defaults to OFF, so
          # `backends/dlfind/` had never been compiled here at all -- the
          # bridge, its seven callbacks, and the `spec` array it hands DL-FIND.
          # What CI did cover was `mqc_optimizer_types`, which is the
          # optimizer's vocabulary and is built either way, so the tests read as
          # though the optimizer were covered while the half that talks to
          # DL-FIND was not compiled.
          #
          # The failure that says so: a `dlfind_optimize` argument added to the
          # real bridge and not to `mqc_dlfind_bridge_stub` builds clean for
          # anyone developing with the option on, and breaks every job here.
          # Only a job with it ON compiles both halves against the same call.
          #
          # libcint comes with it so there is something to optimize *with*. A
          # build-only job would prove the bridge links and nothing about
          # whether it steps: the callbacks, the `spec` array and the geometry
          # coming back all sit behind `api_dl_find`, which a compiler never
          # calls. The validation step below runs a short Hartree-Fock
          # optimization, which is the cheapest thing that exercises them.
          # CREST, which is the heaviest job here and earns it. It is the only
          # configuration where three separate things are exercised at once:
          # that the fork the FetchContent default names is reachable and
          # builds, that CREST reuses this project's tblite instead of
          # fetching a second one, and that the gradient callback still
          # carries numbers across unaltered.
          #
          # WITH_GFN0 is not decoration. crest_search_imtdgc derives its
          # metadynamics length from a flexibility measure that calls GFN0-xTB
          # for Wiberg bond orders and stops without it, whoever supplies the
          # gradients.
          #
          # tblite on both sides deliberately: it is the shared dependency, and
          # the one-line eeq_guess fix in the fork is what lets a released
          # tblite satisfy CREST at all. If upstream tblite changes that call
          # again, this job is where it surfaces.
          - name: "with crest"
            tblite: true
            legacy_mpi: false
            libcint: true
            libfint: true
            crest: true
          - name: "with dlfind"
            tblite: false
            legacy_mpi: false
            libcint: true
            dlfind: true
          # The Python interface needs every backend in one library. backends.py
          # covers standalone and fragmented, xTB and Hartree-Fock -- three of
          # those four paths can break without the others noticing -- and
          # methods.py covers what each backend implements, which is where
          # libxc comes in: without it the Kohn-Sham cases are refused by the
          # build rather than run, and a skip is not a check.
          - name: "python interface"
            tblite: true
            legacy_mpi: false
            libcint: true
            libxc: true
            libfint: true
            python: true
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest

      - name: Install conda environment
        shell: bash -el {0}
        run: |
          conda env create --name mqc --file environment.yml
          conda install -c conda-forge -n mqc gfortran=14.2.0

      - name: Execute cmake and build
        shell: bash -el {0}
        run: |
          conda activate mqc
          export FC=gfortran
          generator=""
          if [ -n "${{ matrix.generator }}" ]; then
            generator="-G ${{ matrix.generator }}"
          fi
          if [ "${{ matrix.defaults }}" = "true" ]; then
            # Deliberately bare: passing any option here would defeat the job.
            cmake -B build
          else
            cmake $generator \
                  -DMQC_ENABLE_TBLITE=${{ matrix.tblite && 'ON' || 'OFF' }} \
                  -DPIC_USE_LEGACY_MPI=${{ matrix.legacy_mpi && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_LIBXC=${{ matrix.libxc && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_CZT=${{ matrix.libcint && 'ON' || 'OFF' }} \
                  -DMQC_USE_LIBFINT=${{ matrix.backend == 'libcint' && 'OFF' || 'ON' }} \
                  -DMQC_ENABLE_HDF5=${{ matrix.hdf5 && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_DLFIND=${{ matrix.dlfind && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_CREST=${{ matrix.crest && 'ON' || 'OFF' }} \
                  ${{ matrix.crest && '-DWITH_GFN0=ON -DWITH_TBLITE=ON' || '' }} \
                  -B build
          fi
          cmake --build build --parallel 2

      # Printed rather than assumed. h5py links the same libhdf5 the Fortran
      # writes with, so its version bounds get a vote on what conda resolves;
      # if that ever pins HDF5 back, this is the line that says so.
      - name: Report the HDF5 in use
        if: matrix.hdf5
        shell: bash -el {0}
        run: |
          conda activate mqc
          conda list -n mqc "hdf5|h5py"
          python3 -c "import h5py; print('h5py', h5py.__version__, 'links HDF5', h5py.version.hdf5_version)"

      # The one check the Fortran suite cannot make. A block written under the
      # wrong declared shape holds the right bytes and round trips through our
      # own bindings exactly, so every Fortran assertion passes and the file is
      # a different tensor to h5py, h5dump and anything else. Being readable by
      # something that is not Fortran is the whole reason this data is in HDF5,
      # so it is checked by something that is not Fortran.
      - name: Check the amplitude file's on-disk layout
        if: matrix.hdf5
        shell: bash -el {0}
        run: |
          conda activate mqc
          cmake --build build --target check_amplitude_layout --parallel 2
          cd validation
          ../build/check_amplitude_layout
          python3 check_amplitude_layout.py

      # The seam the whole integration rests on, and every way it fails is
      # quiet: a callback that is never reached returns zero rather than an
      # error, and a gradient that crossed with the wrong units comes back as
      # a correct energy beside a wrong derivative. So this compares an
      # HF/STO-3G gradient computed directly against the same one routed
      # through CREST, and demands they match exactly.
      #
      # check_crest_search and check_crest_refine run a whole sampling loop
      # and are left as manual checks; they take tens of seconds and the
      # build above is what is actually fragile here.
      - name: Check the CREST gradient callback
        if: matrix.crest
        shell: bash -el {0}
        run: |
          conda activate mqc
          cmake --build build --target check_crest_callback --parallel 2
          ./build/check_crest_callback

      # Compile the cuEST backend, which nothing else here does.
      #
      # MQC_ENABLE_CUEST is OFF by default and turning it on needs CUEST_ROOT
      # and an sm_80 card, so backends/cuest/ -- the bindings and twelve
      # backend modules -- is never handed to a compiler in CI. It can break
      # and stay broken until someone with a card builds it, which is a long
      # way from the change that broke it.
      #
      # Its bindings are plain bind(C) interfaces, so cuEST is needed to link
      # but not to compile, and gfortran type-checks every call against them.
      # This is a compile check and says nothing about whether cuEST returns
      # the right numbers.
      #
      # On the default job only: it needs .mod files from a completed build and
      # any build will do, so running it on all eleven would be the same check
      # eleven times.
      - name: Compile the cuEST backend
        if: matrix.defaults
        shell: bash -el {0}
        run: |
          conda activate mqc
          tools/check_cuest_compiles.sh build

      # Four tests are 80 per cent of this suite's wall time and they are
      # labelled `LONG`; `-LE LONG` leaves them out. The whole suite still runs
      # -- see the job below -- but not on every push of every branch, and not
      # once per matrix entry.
      #
      # Skipped entirely for two jobs. The Python one has *identical* flags to
      # the default build, so its unit-test run repeated that job exactly rather
      # than approximately; what it uniquely covers is the interface, exercised
      # by the examples further down. And the tblite job says "build only" in
      # its name, which until now was true of the xTB validation and not of
      # this step.
      - name: Run unit tests
        if: '!matrix.python && !matrix.build_only'
        shell: bash -el {0}
        run: |
          conda activate mqc
          ctest --test-dir build -V -R "mqc" -LE LONG

      # The four `LONG` tests, on the build the step above already made rather
      # than in a job of their own -- a separate job would rebuild everything to
      # run twenty-five minutes of tests.
      #
      # On `main`, so anything merged is covered, and on demand, so a branch can
      # be checked before it merges. Not on every branch push, which is what
      # made them cost three times over: they need libxc, so they ran in the
      # default, libcint and Python jobs alike.
      - name: Run long unit tests
        if: matrix.defaults && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: bash -el {0}
        run: |
          conda activate mqc
          ctest --test-dir build -V -R "mqc" -L LONG

      # The CPU Hartree-Fock decks, run through mqc the way a user would, and
      # checked against PySCF rather than against numbers this program printed
      # earlier. Separate from the xTB validation below because that one needs
      # tblite and this one needs libcint, and neither job has both.
      # Builds the shared library and runs the examples, which assert rather
      # than print. Nothing else here loads libmqc.so through ctypes, so a
      # renamed C entry point or a changed signature is a segfault at call
      # time and compiles perfectly until then.
      - name: Run Python interface examples
        if: matrix.python
        shell: bash -el {0}
        run: |
          conda activate mqc
          cmake --build build --target mqc_shared --parallel 2
          MQC_LIBRARY=$PWD/build/libmqc.so PYTHONPATH=$PWD/python \
            python3 python/examples/backends.py
          # Separate script, separate failure: backends.py breaking means the
          # plumbing moved, methods.py breaking means a method a deck can run is
          # no longer reachable from Python, or is reachable and wrong.
          MQC_LIBRARY=$PWD/build/libmqc.so PYTHONPATH=$PWD/python \
            python3 python/examples/methods.py

      # A geometry optimization, which is the only thing here that drives
      # DL-FIND rather than merely linking it. Water in STO-3G from a distorted
      # start: about fifty energy-and-gradient evaluations, a second or two, and
      # it fails if the callbacks stop being called, if the geometry stops
      # coming back through `dlf_put_coords`, or if the `spec` array stops
      # describing the system.
      #
      # The manifest checks the structure as well as the energy. A wrong
      # optimization can land inside an energy tolerance while sitting at a
      # geometry nobody meant -- the potential is flat near the minimum, which
      # is the whole difficulty -- so `expected_distances` is what actually
      # constrains it.
      #
      # `--manifest validation_tests.json` also holds the two GFN2 cases; they
      # require tblite, which this job does not build, so they skip rather than
      # fail.
      - name: Run the optimizer validation
        if: matrix.dlfind
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd validation
          python3 run_validation.py --manifest validation_tests.json -v

      # Needs libxc as well as libcint: twelve of these cases name a functional
      # and are refused outright without it, which is how this step first went
      # red -- a libcint-only build, not a broken calculation.
      # Skipped on the Python job: it runs the same 243 cases on the same
      # backend as the default build, and what that job is for is the ctypes
      # boundary, not the physics.
      - name: Run CPU validation tests (${{ matrix.backend || 'libfint' }})
        if: matrix.libcint && matrix.libxc && !matrix.python
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd validation
          python3 run_validation.py --manifest validation_tests_cpu.json -v

      # Skipped where it would repeat itself: the Python job and the tblite
      # build-only job both run this same suite on modern MPI, which the default
      # build already does. What is left is one modern-MPI run and one legacy.
      - name: Run physics validation tests
        if: matrix.tblite && !matrix.python && !matrix.build_only
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd validation
          python3 run_validation.py -v

      - name: Upload validation outputs on failure
        if: failure() && matrix.tblite && !matrix.python && !matrix.build_only
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs-tblite
          path: |
            validation/output_*.json
            validation/validation_logs/*.log
          retention-days: 7

  fpm-build:
    name: FPM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest

      - name: Install conda environment
        shell: bash -el {0}
        run: |
          conda env create --name mqc --file environment.yml
          conda install -c conda-forge -n mqc gfortran=14.2.0

      - name: Create blas and lapack symlinks for openblas
        shell: bash -el {0}
        run: |
          conda activate mqc
          ln -sf $CONDA_PREFIX/lib/libopenblas.so $CONDA_PREFIX/lib/libblas.so
          ln -sf $CONDA_PREFIX/lib/libopenblas.so $CONDA_PREFIX/lib/liblapack.so

      - name: Build with fpm
        shell: bash -el {0}
        run: |
          conda activate mqc
          fpm build --compiler mpifort

      #- name: Run fpm tests
      #  shell: bash -el {0}
      #  run: |
      #    conda activate mqc
      #    fpm test --compiler mpifort
