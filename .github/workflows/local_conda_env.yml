name: Build MQC using local conda env (MPI, OpenMP, BLAS)

on: [push]

jobs:
  cmake-build:
    name: CMake build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shipped default: `cmake -B build` with no flags at all, which is
          # what anyone who clones this gets. Every other job below passes all
          # four options explicitly, so without this one a changed default would
          # be invisible here -- the one configuration nobody tested would be the
          # one everybody builds.
          #
          # The matrix values below are what the defaults currently *are*, and
          # they only decide which validation steps run. If a default drifts away
          # from them this job fails rather than quietly skipping work.
          - name: "default build (no flags)"
            defaults: true
            tblite: true
            legacy_mpi: false
            libcint: true
            libxc: true
          - name: "with tblite"
            tblite: true
            legacy_mpi: false
          - name: "no tblite"
            tblite: false
            legacy_mpi: false
          - name: "with tblite + legacy MPI"
            tblite: true
            legacy_mpi: true
          # libxc is fetched and built from source, and it is large -- several
          # thousand generated functional files. Nothing here compiles it
          # otherwise, so a change that breaks the fetch or the linkage would
          # only surface on someone's machine. tblite is off so this job is
          # only libxc.
          - name: "with libxc"
            tblite: false
            legacy_mpi: false
            libxc: true
          # libcint with libxc explicitly off -- a reduced build now that both are
          # on by default, and worth keeping: it is what you get asking only for
          # the integrals, and it is the configuration where the "this build has
          # no libxc" refusals are the behaviour under test.
          - name: "with libcint"
            tblite: false
            legacy_mpi: false
            libcint: true
          # The Python interface needs both backends in one library: the
          # examples cover standalone and fragmented, xTB and Hartree-Fock, and
          # three of those four paths can break without the others noticing.
          - name: "python interface"
            tblite: true
            legacy_mpi: false
            libcint: true
            python: true
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest

      - name: Install conda environment
        shell: bash -el {0}
        run: |
          conda env create --name mqc --file environment.yml
          conda install -c conda-forge -n mqc gfortran=14.2.0

      - name: Execute cmake and build
        shell: bash -el {0}
        run: |
          conda activate mqc
          export FC=gfortran
          if [ "${{ matrix.defaults }}" = "true" ]; then
            # Deliberately bare: passing any option here would defeat the job.
            cmake -B build
          else
            cmake -DMQC_ENABLE_TBLITE=${{ matrix.tblite && 'ON' || 'OFF' }} \
                  -DPIC_USE_LEGACY_MPI=${{ matrix.legacy_mpi && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_LIBXC=${{ matrix.libxc && 'ON' || 'OFF' }} \
                  -DMQC_ENABLE_LIBCINT=${{ matrix.libcint && 'ON' || 'OFF' }} \
                  -B build
          fi
          cmake --build build

      - name: Run unit tests
        shell: bash -el {0}
        run: |
          conda activate mqc
          ctest --test-dir build -V -R "mqc"

      # The CPU Hartree-Fock decks, run through mqc the way a user would, and
      # checked against PySCF rather than against numbers this program printed
      # earlier. Separate from the xTB validation below because that one needs
      # tblite and this one needs libcint, and neither job has both.
      # Builds the shared library and runs the examples, which assert rather
      # than print. Nothing else here loads libmqc.so through ctypes, so a
      # renamed C entry point or a changed signature is a segfault at call
      # time and compiles perfectly until then.
      - name: Run Python interface examples
        if: matrix.python
        shell: bash -el {0}
        run: |
          conda activate mqc
          cmake --build build --target mqc_shared
          MQC_LIBRARY=$PWD/build/libmqc.so PYTHONPATH=$PWD/python \
            python3 python/examples/backends.py

      - name: Run CPU validation tests (libcint)
        if: matrix.libcint
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd validation
          python3 run_validation.py --manifest validation_tests_cpu.json -v

      - name: Run physics validation tests
        if: matrix.tblite
        shell: bash -el {0}
        run: |
          conda activate mqc
          cd validation
          python3 run_validation.py -v

      - name: Upload validation outputs on failure
        if: failure() && matrix.tblite
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs-tblite
          path: |
            validation/output_*.json
            validation/validation_logs/*.log
          retention-days: 7

  fpm-build:
    name: FPM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest

      - name: Install conda environment
        shell: bash -el {0}
        run: |
          conda env create --name mqc --file environment.yml
          conda install -c conda-forge -n mqc gfortran=14.2.0

      - name: Create blas and lapack symlinks for openblas
        shell: bash -el {0}
        run: |
          conda activate mqc
          ln -sf $CONDA_PREFIX/lib/libopenblas.so $CONDA_PREFIX/lib/libblas.so
          ln -sf $CONDA_PREFIX/lib/libopenblas.so $CONDA_PREFIX/lib/liblapack.so

      - name: Build with fpm
        shell: bash -el {0}
        run: |
          conda activate mqc
          fpm build --compiler mpifort

      #- name: Run fpm tests
      #  shell: bash -el {0}
      #  run: |
      #    conda activate mqc
      #    fpm test --compiler mpifort
