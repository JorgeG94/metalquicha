name: Deploy FORD docs

on:
  push:
    branches:
      - main
  # Lets a deploy be run by hand, e.g. right after the Pages source is changed.
  workflow_dispatch:

# The site is deployed as a Pages artifact rather than committed to a branch.
# Every deploy used to land as a commit on gh-pages-docs, and every clone of the
# repository carried all of them: about 1 GiB against main's 37 MiB.
# Requires Settings -> Pages -> Source: "GitHub Actions".
permissions:
  contents: read
  pages: write     # to deploy to Pages
  id-token: write  # to verify the deployment originates from this workflow

# One deploy at a time. A newer push waits rather than cancelling a deploy that
# is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install FORD
        run: pip install ford

      - name: Pip install graphviz
        run: pip install graphviz==0.20.1

      - name: Install c++ graphviz backend
        run: sudo apt install graphviz

      - name: Build FORD docs
        run: ford -m "PIC_HAVE_BLAS" ford.md

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/fpm-ford

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
